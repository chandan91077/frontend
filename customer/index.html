<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvik Biotecch - Customer Portal</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/customer.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>Anvik Biotecch</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link active">Home</a>
                </li>
                <li class="nav-item">
                    <a href="products.html" class="nav-link">Products</a>
                </li>
                <li class="nav-item">
                    <a href="cart.html" class="nav-link">Cart (<span id="cartCount">0</span>)</a>
                </li>
                <li class="nav-item" id="authSection">
                    <!-- This will be populated by JavaScript -->
                </li>
            </ul>
        </div>
    </nav>

    <main class="customer-main">
        <section class="hero-section">
            <div class="hero-content">
                <h1>Your Health, One Click Away</h1>
                <p>Join our platform for access to top-tier doctors and hassle-free appointments. Your wellness journey starts here.</p>
                <a href="products.html" class="btn btn-primary">Shop Now</a>
            </div>
        </section>

        <section class="featured-products">
            <div class="container">
                <h2>Featured Medicines</h2>
                <div class="products-grid" id="featuredProducts">
                    <!-- Featured products will be loaded by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <!-- Remove type="module" -->
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/customer.js"></script>
    <script src="../scripts/cart.js"></script>
</body>
</html>
