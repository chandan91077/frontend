<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - Anvik Biotecch</title>
    <link rel="stylesheet" href="../styles/main.css?v=4">
    <link rel="stylesheet" href="../styles/customer.css?v=4">

    <!-- ✅ Load ENV File -->
    <script src="../env.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>Anvik Biotecch</h2>
            </div>
            <div class="mobile-menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="products.html" class="nav-link">Products</a>
                </li>
                <li class="nav-item">
                    <a href="cart.html" class="nav-link">Cart (<span id="cartCount">0</span>)</a>
                </li>
                <li class="nav-item" id="authSection"></li>
            </ul>
        </div>
    </nav>

    <main class="customer-main">
        <div class="container">
            <div class="success-message">
                <div class="success-icon">✅</div>
                <h1>Order Placed Successfully!</h1>
                <p>Thank you for your purchase. Your order has been confirmed.</p>
                <p><strong>Order ID:</strong> <span id="orderId"></span></p>
                <p>You will receive a confirmation email shortly.</p>
                <div class="success-actions">
                    <a href="products.html" class="btn btn-primary">Continue Shopping</a>
                    <a href="orders.html" class="btn btn-secondary">View Orders</a>
                </div>
            </div>
        </div>
    </main>

    <script src="../scripts/mobile-menu.js?v=4"></script>
    <script src="../scripts/auth.js?v=4"></script>

    <script>
        const API = window.ENV.API_URL; // ✅ backend from env.js

        document.addEventListener('DOMContentLoaded', function() {
            const orderId = localStorage.getItem('lastOrderId');

            if (orderId) {
                document.getElementById('orderId').textContent = orderId;
                verifyPaymentStatus(orderId);
            }
        });

        async function verifyPaymentStatus(orderId) {
            const statusEl = document.createElement('p');
            statusEl.id = 'paymentStatus';
            statusEl.textContent = 'Confirming payment...';
            document.querySelector('.success-message').appendChild(statusEl);

            try {
                // ✅ First, try to confirm payment on backend
                console.log('🔄 Confirming payment for order:', orderId);
                const confirmRes = await fetch(`${API}/api/payments/confirm/${orderId}`, {
                    method: 'POST',
                    headers: authService.getAuthHeaders()
                });

                const confirmData = await confirmRes.json();
                console.log('📥 Confirmation response:', confirmData);

                if (confirmRes.ok && confirmData.order?.paymentStatus === 'completed') {
                    console.log('✅ Payment confirmed successfully!');
                    statusEl.textContent = '✅ Payment confirmed successfully!';
                    
                    // ✅ Clear cart on success
                    localStorage.removeItem('cart');
                    updateCartCount();
                    return;
                }

                // ✅ If confirmation fails, verify status
                console.log('🔍 Verifying payment status...');
                const verifyRes = await fetch(`${API}/api/payments/cashfree/verify/${orderId}`, {
                    headers: authService.getAuthHeaders()
                });

                const verifyData = await verifyRes.json();
                console.log('📥 Verification response:', verifyData);

                if (verifyData.paymentStatus === 'completed') {
                    statusEl.textContent = '✅ Payment successful. Thank you!';
                    localStorage.removeItem('cart');
                    updateCartCount();
                    return;
                }

                // ✅ If still pending, show status and poll
                statusEl.textContent = `Payment status: ${verifyData.paymentStatus || 'pending'}`;

                // ✅ Poll every 3 seconds for updates
                let pollCount = 0;
                const pollInterval = setInterval(async () => {
                    pollCount++;
                    console.log(`⏳ Polling... attempt ${pollCount}`);

                    try {
                        const pollRes = await fetch(`${API}/api/payments/cashfree/verify/${orderId}`, {
                            headers: authService.getAuthHeaders()
                        });

                        const pollData = await pollRes.json();

                        if (pollData.paymentStatus === 'completed') {
                            clearInterval(pollInterval);
                            statusEl.textContent = '✅ Payment confirmed!';
                            localStorage.removeItem('cart');
                            updateCartCount();
                            return;
                        } else if (pollData.paymentStatus === 'failed') {
                            clearInterval(pollInterval);
                            statusEl.textContent = '❌ Payment failed. Please try again.';
                            return;
                        }

                        statusEl.textContent = `Status: ${pollData.paymentStatus} (checked ${pollCount} times)`;

                        // ✅ Stop polling after 30 seconds
                        if (pollCount > 10) {
                            clearInterval(pollInterval);
                            statusEl.textContent = 'Payment verification timeout. Your order is ' + pollData.paymentStatus + '. Please check back shortly.';
                        }
                    } catch (err) {
                        console.error('Poll error:', err);
                    }
                }, 3000);

            } catch (err) {
                statusEl.textContent = '⚠️ Error confirming payment. Please refresh to check status.';
                console.error('Confirmation error', err);
            }
        }
    </script>
</body>
</html>
